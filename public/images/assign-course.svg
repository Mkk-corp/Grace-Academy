<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9932c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b455"/>
      <stop offset="100%" stop-color="#b07d1e"/>
    </linearGradient>
    <linearGradient id="bookSpineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5c1a"/>
      <stop offset="100%" stop-color="#a07628"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9932c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="personGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
  </defs>

  <!-- Background blobs -->
  <circle cx="240" cy="170" r="140" fill="url(#bgGrad)"/>
  <circle cx="370" cy="80" r="60" fill="#c9932c" opacity="0.06"/>
  <circle cx="110" cy="260" r="50" fill="#8b5cf6" opacity="0.07"/>

  <!-- Main book body -->
  <rect x="145" y="75" width="120" height="162" rx="10" fill="url(#bookGrad)" filter="url(#softShadow)"/>
  <!-- Book spine -->
  <rect x="140" y="80" width="14" height="152" rx="7" fill="url(#bookSpineGrad)"/>
  <!-- Page edge -->
  <rect x="259" y="80" width="6" height="152" rx="3" fill="rgba(255,255,255,0.18)"/>

  <!-- Book lines (text simulation) -->
  <rect x="168" y="118" width="80" height="4" rx="2" fill="rgba(255,255,255,0.55)"/>
  <rect x="168" y="130" width="68" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
  <rect x="168" y="140" width="76" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
  <rect x="168" y="152" width="56" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="168" y="162" width="72" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="168" y="172" width="60" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="168" y="184" width="80" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <!-- Bookmark ribbon -->
  <polygon points="218,75 226,75 226,100 222,96 218,100" fill="#ef4444"/>

  <!-- Award badge (top right) -->
  <circle cx="312" cy="108" r="42" fill="url(#badgeGrad)" filter="url(#softShadow)"/>
  <circle cx="312" cy="108" r="36" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Star in badge -->
  <path d="M312 82 l6.2 18.6h19.6l-15.9 11.5 6.1 18.6L312 119.2l-15.9 11.5 6.1-18.6L286.3 101h19.6z" fill="url(#starGrad)" filter="url(#glow)"/>

  <!-- Check mark circle (bottom right of badge) -->
  <circle cx="342" cy="134" r="13" fill="#10b981"/>
  <polyline points="336,134 340,138 348,130" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Person/teacher figure -->
  <circle cx="205" cy="275" r="22" fill="url(#personGrad)"/>
  <path d="M183 305 q22-16 44 0" stroke="url(#personGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Person detail lines -->
  <line x1="200" y1="270" x2="210" y2="270" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="202" y1="277" x2="208" y2="277" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sparkle dots -->
  <circle cx="115" cy="110" r="5" fill="#c9932c" opacity="0.8"/>
  <circle cx="108" cy="122" r="3" fill="#c9932c" opacity="0.5"/>
  <circle cx="126" cy="118" r="3" fill="#c9932c" opacity="0.5"/>

  <circle cx="370" cy="200" r="5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="362" cy="212" r="3" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="378" cy="210" r="3" fill="#8b5cf6" opacity="0.5"/>

  <circle cx="130" cy="195" r="4" fill="#10b981" opacity="0.7"/>
  <circle cx="350" cy="155" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="340" cy="240" r="3" fill="#c9932c" opacity="0.6"/>

  <!-- Small floating lines decoration -->
  <line x1="90" y1="155" x2="108" y2="155" stroke="#c9932c" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="380" y1="130" x2="395" y2="130" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="380" y1="138" x2="390" y2="138" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
</svg>
