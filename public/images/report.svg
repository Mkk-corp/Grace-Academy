<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" fill="none">
  <!-- soft glow behind document -->
  <ellipse cx="170" cy="200" rx="130" ry="40" fill="#c9932c" opacity=".06"/>

  <!-- document shadow -->
  <rect x="68" y="32" width="178" height="220" rx="14" fill="#c9932c" opacity=".07"/>

  <!-- document body -->
  <rect x="60" y="24" width="178" height="220" rx="14" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- gold left accent bar -->
  <rect x="60" y="24" width="5" height="220" rx="3" fill="#c9932c" opacity=".7"/>

  <!-- header block -->
  <rect x="82" y="44" width="120" height="11" rx="4" fill="#c9932c" opacity=".18"/>
  <rect x="82" y="44" width="60" height="11" rx="4" fill="#c9932c" opacity=".35"/>

  <!-- divider -->
  <line x1="78" y1="68" x2="220" y2="68" stroke="#e5e7eb" stroke-width="1"/>

  <!-- text lines -->
  <rect x="82" y="82" width="110" height="8" rx="3" fill="#d1d5db"/>
  <rect x="82" y="98" width="126" height="8" rx="3" fill="#d1d5db"/>
  <rect x="82" y="114" width="96" height="8" rx="3" fill="#d1d5db"/>

  <rect x="82" y="134" width="118" height="8" rx="3" fill="#d1d5db"/>
  <rect x="82" y="150" width="104" height="8" rx="3" fill="#d1d5db"/>
  <rect x="82" y="166" width="130" height="8" rx="3" fill="#d1d5db"/>

  <!-- partial last line being written (gold) -->
  <rect x="82" y="186" width="60" height="8" rx="3" fill="#c9932c" opacity=".45"/>
  <!-- blinking cursor line -->
  <rect x="146" y="184" width="2.5" height="12" rx="1" fill="#c9932c" opacity=".75"/>

  <!-- pencil body -->
  <g transform="rotate(-38 230 210)">
    <!-- eraser cap -->
    <rect x="218" y="158" width="18" height="8" rx="2" fill="#f87171"/>
    <!-- metal band -->
    <rect x="218" y="165" width="18" height="5" rx="1" fill="#c9932c" opacity=".6"/>
    <!-- pencil body -->
    <rect x="218" y="170" width="18" height="52" rx="2" fill="#fef3c7"/>
    <!-- wood tip -->
    <polygon points="218,222 236,222 227,242" fill="#d4a574"/>
    <!-- graphite tip -->
    <polygon points="222,234 232,234 227,242" fill="#374151"/>
  </g>

  <!-- sparkle dots near pen tip -->
  <circle cx="196" cy="230" r="3.5" fill="#c9932c" opacity=".7"/>
  <circle cx="208" cy="218" r="2.5" fill="#c9932c" opacity=".5"/>
  <circle cx="184" cy="218" r="2" fill="#c9932c" opacity=".4"/>

  <!-- progress dots bottom -->
  <circle cx="148" cy="264" r="5" fill="#c9932c" opacity=".8"/>
  <circle cx="165" cy="264" r="5" fill="#c9932c" opacity=".45"/>
  <circle cx="182" cy="264" r="5" fill="#c9932c" opacity=".2"/>
</svg>
